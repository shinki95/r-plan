<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Rose Ave 방 3D: 지금 / 바꾼 뒤</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#f4f1ec;color:#2a2622;overflow:hidden}
#c{position:fixed;inset:0}
.bar{position:fixed;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100vw - 20px);z-index:5}
.bar button{border:1px solid #c9bfb2;background:#fffaf3;border-radius:18px;padding:7px 12px;font-size:14px;color:#2a2622}
.bar button.on{background:#3b2f25;color:#fff;border-color:#3b2f25}
#panel{position:fixed;right:10px;top:56px;bottom:10px;width:340px;background:#fffaf3ee;border:1px solid #d8cfc2;border-radius:12px;overflow:auto;padding:12px 14px;font-size:13px;z-index:5}
#panel h3{margin:4px 0 6px;font-size:15px}#panel .row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #eee3d5}
#panel .n{flex:0 0 22px;height:22px;border-radius:11px;background:#8a5a2b;color:#fff;text-align:center;line-height:22px;font-size:12px}
#panel .n.r{background:#7a7a7a}#panel .n.x{background:#c0392b}
#panel .p{margin-left:auto;font-weight:600;white-space:nowrap}#panel small{color:#7b6f62}
.lbl{background:#3b2f25e6;color:#fff;border-radius:10px;padding:2px 7px;font-size:12px;white-space:nowrap;pointer-events:none}
.lbl.r{background:#6b6b6be6}.lbl.x{background:#c0392be6}
.note{color:#7b6f62;font-size:12px;line-height:1.5}
@media (max-width:760px){#panel{top:auto;left:8px;right:8px;width:auto;height:38vh}.bar button{padding:6px 10px;font-size:13px}}
</style></head><body>
<div id="c"></div>
<div class="bar">
 <button id="bNow">지금</button><button id="bAfter" class="on">바꾼 뒤</button>
 <button data-v="top">위에서</button><button data-v="sofa">소파에서</button><button data-v="bed">침대에서</button><button data-v="desk">책상에서</button><button data-v="bath">화장실</button>
 <button id="bLbl" class="on">이름표</button><button id="bList" class="on">목록</button>
</div>
<div id="panel"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
const el=document.getElementById('c');
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.localClippingEnabled=true;el.appendChild(r.domElement);
const lr=new CSS2DRenderer();lr.domElement.style.position='fixed';lr.domElement.style.inset='0';lr.domElement.style.pointerEvents='none';el.appendChild(lr.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xf4f1ec);
s.add(new THREE.HemisphereLight(0xfff4e6,0x8a7a66,2.2));const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(3,6,2);s.add(dl);
const cam=new THREE.PerspectiveCamera(65,1,0.05,100);const ctl=new OrbitControls(cam,r.domElement);ctl.enableDamping=true;
const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),2.3);
const scanMats=[];
new GLTFLoader().load('room.glb',g=>{const root=g.scene;root.rotation.y=-Math.PI/2;root.position.y=1.35;
 root.traverse(o=>{if(o.isMesh){const m=new THREE.MeshBasicMaterial({map:o.material.map,side:THREE.DoubleSide,clippingPlanes:[clip]});o.material=m;scanMats.push(m);}});
 s.add(root);setMode(true);go('sofa');window.ready=true;});
const after=new THREE.Group();s.add(after);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,...o});
function box(w,h,d,x,y,z,mat,parent=after){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m}
function cyl(rt,rb,h,x,y,z,mat,parent=after){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,32),mat);m.position.set(x,y,z);parent.add(m);return m}
function label(text,x,y,z,cls=''){const d=document.createElement('div');d.className='lbl '+cls;d.textContent=text;const o=new CSS2DObject(d);o.position.set(x,y,z);after.add(o);return o}
const walnut=M(0x3a2a20),black=M(0x1d1b19),linen=M(0xeadfcc,{emissive:0xffb36b,emissiveIntensity:.55}),white=M(0xf7f5f0),beige=M(0xc9b79c),brass=M(0xb08d57,{metalness:.6,roughness:.4});
// 1 long desk LAGKAPTEN 200x60 + 5 OLOV legs (wall z=2.38)
box(2.0,.035,.6,1.45,.74,2.07,walnut);[[0.5,1.82],[2.4,1.82],[0.5,2.33],[2.4,2.33],[1.45,2.33]].forEach(([x,z])=>cyl(.025,.025,.72,x,.36,z,black));
label('1 긴 책상 200cm',1.45,.95,2.0);
// 2 UGGLERUM nightstand + 3 HALGATT lamp
box(.46,.03,.40,2.27,.67,-1.80,walnut);box(.46,.03,.40,2.27,.02,-1.80,walnut);box(.03,.67,.40,2.49,.335,-1.80,walnut);
cyl(.07,.075,.2,2.24,.79,-1.82,beige);cyl(.11,.16,.2,2.24,1.0,-1.82,linen);
const pl1=new THREE.PointLight(0xffb36b,1.2,3.5,1.5);pl1.position.set(2.24,1.0,-1.82);after.add(pl1);
label('2 협탁',2.27,.55,-1.6);label('3 침대 스탠드',2.24,1.22,-1.82);
// 4 ÖKENSAND floor lamp by sofa/recliner corner
cyl(.24,.24,.03,4.56,.015,-.74,beige);cyl(.012,.012,1.4,4.56,.72,-.74,beige);cyl(.15,.18,.25,4.56,1.42,-.74,linen);
const pl2=new THREE.PointLight(0xffb36b,1.4,4,1.5);pl2.position.set(4.56,1.42,-.74);after.add(pl2);label('4 플로어 램프',4.56,1.65,-.74);
// 5 bedding white duvet + pillows (bed x .4-2.0, z -2.0..0.05)
box(1.70,.10,1.66,1.2,.80,-.70,white);box(.62,.14,.38,.82,.86,-1.78,white);box(.62,.14,.38,1.56,.86,-1.78,white);
label('5 흰 이불·커버',1.2,.9,-.6);
// 6 curtains on window wall x=4.82, window z -1.4..0.8, rod near ceiling
cyl(.012,.012,3.0,4.74,2.36,-.3,brass).rotation.x=Math.PI/2;
const cur=M(0xfbf8f2,{transparent:true,opacity:.93});box(.06,2.34,.6,4.73,1.18,-1.48,cur);box(.06,2.34,.6,4.73,1.18,.88,cur);
label('6 리넨 커튼(천장 가까이)',4.7,2.1,-.3);
// 7 scent on desk
cyl(.035,.035,.12,2.3,.82,2.2,M(0x9a8bb5));label('7 향(리드·필로우 스프레이)',2.3,1.0,2.2);
// R recliner (separate budget) ARNÄSVALL 91x93x105, window side facing the TV wall, plus reclined footprint
const rec=new THREE.Group();rec.position.set(4.3,0,.08);rec.rotation.y=Math.PI*0.12;after.add(rec);
box(.91,.42,.93,0,.21,0,beige,rec);box(.91,.6,.18,0,.72,-.38,beige,rec);box(.16,.2,.8,-.38,.52,.03,beige,rec);box(.16,.2,.8,.38,.52,.03,beige,rec);
const ghost=new THREE.Mesh(new THREE.PlaneGeometry(.91,1.78),new THREE.MeshBasicMaterial({color:0x777777,transparent:true,opacity:.28,side:THREE.DoubleSide}));ghost.rotation.x=-Math.PI/2;ghost.position.set(0,.01,.42);rec.add(ghost);
label('R 리클라이너 자리(따로 예산) · 회색=펼친 길이',4.25,1.2,.3,'r');
// T optional TV + KALLAX TV unit (only if he has a TV)
const tvg=new THREE.Group();after.add(tvg);
box(1.47,.6,.39,3.3,.3,2.18,M(0x3a2a20,{transparent:true,opacity:.55}),tvg);box(1.23,.71,.05,3.3,.98,2.25,M(0x111111,{transparent:true,opacity:.6}),tvg);
label('T TV 자리(TV가 있으면)',3.3,1.45,2.2,'r');
// bathroom bits (approx, x -4.4..-2.9, z -2..0)
box(.3,.12,.22,-3.45,.95,-1.75,white);label('B 화장실: 샤워커튼·펌프통·수건·트레이',-3.6,1.6,-1.0);
// X: things to take out (free)
[['빼기: 커피 테이블',3.8,.6,-.67],['옮기기: 신발 선반 → 복도',2.95,1.3,2.15],['치우기: 바닥 박스·물·카트',.45,.9,2.05],['치우기: 선풍기·청소기',4.5,.9,.3]].forEach(([t,x,y,z])=>label(t,x,y,z,'x'));
// ===== UI
const items=[
['1','긴 책상 상판 LAGKAPTEN 200x60cm 검정갈색','79.99','어제 호텔처럼 긴 책상. 의자 그대로, 팔꿈치 높이에 맞춰 다리 고정'],
['1','OLOV 높이조절 다리 x5 (200cm는 가운데 다리 필요)','62.50','60~90cm 조절'],
['2','협탁 UGGLERUM 46x40x67cm','99.99','호텔식 둥근 나무 협탁. 지금 흰 협탁은 화장실·옷장 수납으로'],
['3','침대 스탠드 HALGATT 리넨 갓, 밝기 조절','59.99','천장등 끄고 낮은 불 1'],
['4','플로어 램프 ÖKENSAND 155cm','89.99','소파·리클라이너 사이 낮은 불 2'],
['0','2700K 전구 (SOLHETTA 등)','~25','집 전구를 한 색으로. 개수 몰라 추정'],
['5','Marriott 호텔 이불 속통 (30% 할인, 11/29까지)','118.30','Full 기준 가격, 퀸 가격은 확인 필요'],
['5','ÄNGSLILJA 흰 이불커버 Full/Queen','39.99','호텔 흰 침구'],
['6','DYTÅG 리넨 커튼 1쌍 145x250cm','99.99','봉은 천장 가까이, 창보다 넓게'],
['6','커튼 봉 (창 약 2.2m + 양옆 여유)','~15','추정'],
['7','Alice + Co 리드 + 필로우 스프레이 (30% 할인)','33.60','어제 방 향'],
['B','천 샤워 커튼 (IKEA BORSTÅLÖE)','14.99','렌트 화장실에서 제일 큰 천'],
['B','벽 부착 펌프통 3개 (Maisonovo)','45.00','구멍 없이 붙임'],
['B','Alice + Co 샴푸·컨디셔너·바디워시','39.90','각 $13.30'],
['B','VÅGSJÖN 흰 수건 4 + 손수건 2','41.94','같은 수건, 같은 접기'],
['B','TAVELÅN 트레이 2개','13.99','세면대 비우기']];
const total=items.reduce((a,i)=>a+parseFloat(i[2].replace('~','')),0);
let h=`<h3>사야 할 것 ($1,000 안)</h3><div class="note">가격은 11/24 기준, 세금 별도. 크기는 스캔 눈대중이라 사기 전 줄자로 확인.</div>`;
h+=items.map(i=>`<div class="row"><div class="n">${i[0]}</div><div>${i[1]}<br><small>${i[3]}</small></div><div class="p">$${i[2]}</div></div>`).join('');
h+=`<div class="row"><div></div><div><b>합계</b><br><small>세금 약 10% 넣으면 약 $${Math.round(total*1.1)}</small></div><div class="p">$${total.toFixed(2)}</div></div>`;
h+=`<h3>따로 정할 것</h3>
<div class="row"><div class="n r">R</div><div>리클라이너 IKEA ARNÄSVALL 91x93cm, 회전·흔들<br><small>창가 자리. 펼친 길이는 IKEA가 안 적어 둠</small></div><div class="p">$499</div></div>
<div class="row"><div class="n r">R</div><div>Ashley Kegler 99x114cm<br><small>벽에서 30cm, 펼치면 178cm. 이 자리엔 커요</small></div><div class="p">$449.99</div></div>
<div class="row"><div class="n r">T</div><div>KALLAX TV장 147x39cm (TV가 있으면)<br><small>소파 맞은편 벽, 책상 옆</small></div><div class="p">$79.99</div></div>
<h3>공짜로 먼저 (0단계)</h3>
<div class="row"><div class="n x">X</div><div>커피 테이블 빼기, 신발 선반 복도로, 바닥 박스·물·카트·선풍기 옷장으로, 천장등 끄고 지내기</div><div class="p">$0</div></div>
<div class="note" style="margin-top:8px">스캔: Polycam Space 모드(아이폰 17, 라이다 없음). 방 약 4.4 x 4.4m, 천장 약 2.43m. 치수는 줄자 확인 전.</div>`;
document.getElementById('panel').innerHTML=h;
const V={top:[[2.6,9,0.2],[2.6,0,0.2],2.0],sofa:[[3.75,1.2,-1.55],[2.4,0.85,2.3],2.3],bed:[[1.6,1.1,-1.6],[4,0.9,1.2],2.3],desk:[[1.4,1.25,1.4],[3.6,0.8,-1.4],2.3],bath:[[-2.2,2.9,-0.2],[-3.7,0.5,-1.3],2.0],over:[[6.2,5.2,4.6],[2.4,0,0.2],2.3]};
function go(k){const v=V[k];cam.position.set(...v[0]);ctl.target.set(...v[1]);clip.constant=v[2];cam.fov=k==='top'?50:70;cam.updateProjectionMatrix();ctl.update();document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===k));}
window.go=go;
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
function setMode(a){after.visible=a;scanMats.forEach(m=>m.color.set(a?0xffe6c8:0xffffff));bNow.classList.toggle('on',!a);bAfter.classList.toggle('on',a);}
window.setMode=setMode;
bNow.onclick=()=>setMode(false);bAfter.onclick=()=>setMode(true);
bLbl.onclick=()=>{const on=!bLbl.classList.contains('on');bLbl.classList.toggle('on',on);lr.domElement.style.display=on?'':'none'};
bList.onclick=()=>{const on=!bList.classList.contains('on');bList.classList.toggle('on',on);panel.style.display=on?'':'none'};
function rs(){r.setSize(innerWidth,innerHeight);lr.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
r.setAnimationLoop(()=>{ctl.update();r.render(s,cam);lr.render(s,cam)});
</script></body></html>
